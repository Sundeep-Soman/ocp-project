# Purpose: Uses RHACM enforcement to install and verify the cert-manager Operator on cluster2.
# Important: Automatic InstallPlan approval allows OLM to complete installation without manual approval.
# Important: The ClusterServiceVersion status check provides an explicit Succeeded compliance signal.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-install-cert-manager
  namespace: cluster2-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: SC System and Communications Protection
    policy.open-cluster-management.io/controls: SC-12 Cryptographic Key Establishment
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: install-cert-manager-config
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            # Operator namespace required by the cert-manager Operator.
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: cert-manager-operator
            # Single-namespace OperatorGroup keeps the operator scope explicit.
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: openshift-cert-manager-operator
                  namespace: cert-manager-operator
                spec:
                  targetNamespaces:
                    - cert-manager-operator
            # Subscription selects the stable-v1 cert-manager channel from Red Hat Operators.
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: openshift-cert-manager-operator
                  namespace: cert-manager-operator
                spec:
                  channel: stable-v1
                  installPlanApproval: Automatic
                  name: openshift-cert-manager-operator
                  source: redhat-operators
                  sourceNamespace: openshift-marketplace
            # Compliance check: ACM expects a successful ClusterServiceVersion.
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: ClusterServiceVersion
                metadata:
                  namespace: cert-manager-operator
                status:
                  phase: Succeeded
---
# Purpose: Binds cert-manager installation policy to cluster2.
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-install-cert-manager
  namespace: cluster2-policies
placementRef:
  name: placement-cluster2
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-install-cert-manager
    apiGroup: policy.open-cluster-management.io
    kind: Policy
