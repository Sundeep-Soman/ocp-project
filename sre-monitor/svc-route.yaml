apiVersion: v1
kind: Service
metadata:
  name: sre-monitor
  namespace: sre-monitor
  labels:
    app: sre-monitor
spec:
  selector:
    app: sre-monitor
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sre
  namespace: sre-monitor
spec:
  host: sre.etcd.store
  to:
    kind: Service
    name: sre-monitor
  port:
    targetPort: http
  tls:
    termination: edge
    externalCertificate:
      name: sre-etcd-store-tls


