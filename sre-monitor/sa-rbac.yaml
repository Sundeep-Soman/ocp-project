# Read-only RBAC so the monitor can query cluster state.
# NEVER grant write/delete here - a monitor only needs get/list.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-monitor
  namespace: sre-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-monitor-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["config.openshift.io"]
    resources: ["clusteroperators"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-monitor-read
subjects:
  - kind: ServiceAccount
    name: sre-monitor
    namespace: sre-monitor
roleRef:
  kind: ClusterRole
  name: sre-monitor-read
  apiGroup: rbac.authorization.k8s.io
