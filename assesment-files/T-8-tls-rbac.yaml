apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: router-cert-access
  namespace: sre-monitor
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
    - sre-etcd-store-tls
  verbs:
    - get
    - watch
    - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: router-cert-access
  namespace: sre-monitor
subjects:
- kind: ServiceAccount
  name: router
  namespace: openshift-ingress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: router-cert-access
