# Purpose: Enforces CLI and OpenShift Console login/use notification banners on cluster2.
# Important: remediationAction=enforce at both policy levels keeps the configuration present.
# Important: The PlacementBinding below limits enforcement to the cluster2 placement.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-login-banner
  namespace: cluster2-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: AC Access Control
    policy.open-cluster-management.io/controls: AC-8 System Use Notification
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: login-banner-config
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            # CLI login banner: the motd ConfigMap used by OpenShift authentication/login messaging.
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: motd
                  namespace: openshift
                data:
                  message: |
                    ****************************************************************
                    WARNING: Authorized access only. This system is monitored.
                    Unauthorized use is prohibited and may be prosecuted.
                    ****************************************************************
            # Console banner: displayed at the top of the OpenShift web console.
            - complianceType: musthave
              objectDefinition:
                apiVersion: console.openshift.io/v1
                kind: ConsoleNotification
                metadata:
                  name: login-banner
                spec:
                  text: "Authorized access only. Activity is monitored and logged."
                  location: BannerTop
                  color: '#ffffff'
                  backgroundColor: '#c00000'
---
# Purpose: Binds policy-login-banner to placement-cluster2 so ACM enforces it on cluster2.
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-policy-login-banner
  namespace: cluster2-policies
placementRef:
  name: placement-cluster2
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-login-banner
    apiGroup: policy.open-cluster-management.io
    kind: Policy
