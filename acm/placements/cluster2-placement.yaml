# Purpose: Selects only cluster2 as the target for RHACM policies in cluster2-policies.
# Important: The cluster label name=cluster2 must exist on the ACM ManagedCluster.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-cluster2
  namespace: cluster2-policies
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: name
              operator: In
              values:
                - cluster2
