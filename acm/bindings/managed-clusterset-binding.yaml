# Purpose: Grants the cluster2-policies namespace access to the ACM default ManagedClusterSet.
# Important: This binding is required so policies in this namespace can target managed clusters in the set.
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: default
  namespace: cluster2-policies
spec:
  clusterSet: default
