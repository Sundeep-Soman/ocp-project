# Purpose: Configures cert-manager to obtain Let's Encrypt certificates using Route 53 DNS-01 validation.
# Important: AWS accessKeyID is intentionally redacted; use a protected credential source and never commit secrets to Git.
# Important: This lab uses the AWS Mumbai region (ap-south-1) and the specified Route 53 hosted zone.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-route53
spec:
  acme:
    email: learndevops33@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-route53-account
    solvers:
      - dns01:
          route53:
            region: ap-south-1
            hostedZoneID: Z0090885357R3XH6AW0MQ
            accessKeyID: "<REDACTED>"
            secretAccessKeySecretRef:
              name: route53-credentials
              key: secret-access-key
