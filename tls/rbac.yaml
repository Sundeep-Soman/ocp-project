# Purpose: Allows the OpenShift ingress router to read only the SRE TLS Secret in sre-monitor.
# Important: Access is limited to one named Secret and get/watch/list operations.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: router-cert-access
  namespace: sre-monitor
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
    - sre-etcd-store-tls
  verbs:
    - get
    - watch
    - list
---
# Purpose: Binds router-cert-access to the OpenShift ingress router ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: router-cert-access
  namespace: sre-monitor
subjects:
- kind: ServiceAccount
  name: router
  namespace: openshift-ingress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: router-cert-access
