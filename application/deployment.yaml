# Purpose: Deploys the read-only SRE monitoring application, including resource limits and health probes.
# Important: The container runs as a non-root UID and has explicit CPU/memory requests and limits.
# Important: Readiness and liveness probes use the application health endpoints.
# Important: The application image is versioned so Git commits can be rolled back cleanly.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-monitor
  namespace: sre-monitor
  labels:
    app: sre-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-monitor
  template:
    metadata:
      labels:
        app: sre-monitor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sre-monitor        # <-- uses the read-only SA
      containers:
        - name: sre-monitor
          image: imsundeepdocker/sre-dashboard:v3
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "2.0.0"
            - name: ALERT_THRESHOLD      # 0 = disabled; >0 makes /healthz 503 when exceeded
              value: "0"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5